<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · 09Test Portal</title>
  <link rel="icon" type="image/png" href="/assets/09logo.png">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-brand"><img class="brand-mark" src="/assets/09logo.png" alt="2009Scape"><h1>09Test Portal</h1></div>
    <p class="muted">Restricted access to the Current Test deployment</p>
    <a class="button discord" href="/auth/discord">Continue with Discord</a>
    <div class="separator"><span>or</span></div>
    <form method="post" action="/auth/local">
      <label for="password">Administrator password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="button secondary" type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
