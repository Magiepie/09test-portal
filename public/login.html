<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · 09Test Portal</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand-mark">09</div>
    <p class="eyebrow">SERVER OPERATIONS</p>
    <h1>09Test Portal</h1>
    <p class="muted">Restricted access to the Current Test deployment and live server console.</p>
    <a class="button discord" href="/auth/discord">Continue with Discord</a>
    <div class="separator"><span>Emergency access</span></div>
    <form method="post" action="/auth/local">
      <label for="password">Local administrator password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="button secondary" type="submit">Sign in locally</button>
    </form>
  </main>
</body>
</html>
